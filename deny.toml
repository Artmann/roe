[advisories]
# A yanked dependency is a supply-chain problem for a tool we ship to crates.io,
# npm, and NuGet from this exact lockfile.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, plus MPL-2.0. MPL's copyleft is per-file: linking
# `colored` into roe without modifying its sources carries no obligation onto
# roe's own MIT-licensed code. Anything not on this list needs a deliberate
# decision, so keep the list explicit rather than broadening it reflexively.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# Allowing a license the tree happens not to use yet isn't a problem worth
# reporting; it just means a common permissive license is pre-approved.
unused-allowed-license = "allow"

[bans]
# Warn, don't deny. The tree-sitter, globset, and ignore trees legitimately pull
# duplicate transitive versions, and denying that would block unrelated changes.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
