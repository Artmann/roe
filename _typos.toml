[files]
# Fixtures are hand-written C# solutions full of deliberately odd identifiers,
# snapshots are generated from them, and Cargo.lock is machine-owned. So is
# CHANGELOG.md: release-please writes it, and the short commit hashes it links
# to regularly contain typo-shaped fragments such as `ba`.
extend-exclude = ["CHANGELOG.md", "Cargo.lock", "tests/fixtures/", "tests/snapshots/"]

[default.extend-identifiers]
# Deliberate misspelling of the `aggressive` config field, used by
# `rejects_unknown_fields` in src/config.rs to prove serde rejects near-miss
# keys instead of silently ignoring them.
agressive = "agressive"
# Same idea for the `ignore` field, used by `rejects_unknown_dead_code_fields`.
ignor = "ignor"
